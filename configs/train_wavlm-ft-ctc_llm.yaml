model:
  wavlm_model_path: /home/25/minh/CTC-assisted-ASR-LLM/exp/wavlm-ft-libri_2/final
  llm_model_path: lmsys/vicuna-7b-v1.5
  freeze_encoder: true
  freeze_llm: true
  use_lora: false
  projector:
    input_dim: 1024
    hidden_dim: 2048
    output_dim: 4096
    conv_kernel_size: 5

training:
  batch_size: 4
  grad_accumulation : 1
  learning_rate: 1e-4
  beta1: 0.9
  beta2: 0.999
  weight_decay: 0.0
  warmup_steps: 1000
  max_steps: 100000
  num_epochs: 0
  gradient_clip: 1.0
  clip_grad_norm: 1.0
  eval_every: 5000 
  save_every: 20000
  save_total_limit: 2
  log_every: 100
  num_workers: 4
  pin_memory:

data:
  sample_rate: 16000
  p_keep: 0.5
  n_phrases: 1
  n_order_max: 4

hotword_filter:
  common_words_path: data/common_words_5k.txt
  n_gram: 2
  top_k: 10

inference:
  max_new_tokens: 256
  num_beams: 4
  temperature: 1.0
  use_hotword_filtering: true
